appId: com.shadowider.eCRM
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd
# A failed flow can leave the app deep in a stack: back out to the tab bar.
# A back that lands outside the app (it was still resuming) is undone by the
# relaunch; the session survives, flows never sign in.
- repeat:
    times: 6
    while:
      notVisible: "More"
    commands:
      - hideKeyboard
      - back
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
# Lands on Today. Open a list through Home's figures ("Open My complaints",
# the Leads and Follow-ups tiles), not its tab: the tabs stay mounted between
# flows and keep whatever preset, pill or search the last flow left, while
# Home navigates with a filter that resets all three.
# The bar's Today tab by id: a pushed Follow-ups screen has a "Today" view too.
- tapOn:
    id: "pill-Home"
- extendedWaitUntil:
    visible:
      id: "home-list"
    timeout: 15000
