appId: com.shadowider.eCRM
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd
# A failed flow can leave the app deep in a stack: back out to the tab bar.
# A back that lands outside the app (it was still resuming) is undone by the
# relaunch; the session survives, flows never sign in.
- repeat:
    times: 6
    while:
      notVisible: "More"
    commands:
      - hideKeyboard
      - back
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
# Lands on Home. Open a list through Home's rows ("My complaints", "My leads",
# "Follow-ups due today"), not its tab: the tabs stay mounted between flows and
# keep whatever queue, chip or search the last flow left, while Home's rows
# navigate with a filter that resets all three.
- tapOn:
    text: "Home"
    index: 0
- assertVisible: "Today"
