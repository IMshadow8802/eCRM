appId: com.shadowider.eCRM
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd
# A failed flow can leave the app deep in a stack: back out to the tab bar.
# A back that lands outside the app (it was still resuming) is undone by the
# relaunch; the session survives, flows never sign in.
- repeat:
    times: 6
    while:
      notVisible: "More"
    commands:
      - hideKeyboard
      - back
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
# Lands on More: the module tabs (Complaints, Leads, ...) are on the bar for
# the next tap, and Follow-ups / Workspaces / Inbox / Profile are on screen.
- tapOn:
    text: "More"
    index: 0
- assertVisible: "Profile"
