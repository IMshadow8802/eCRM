# Adds a lead "MAESTRO Lead <stamp>" (company "MAESTRO Co <stamp>", value
# 120000, owner left as the default) and lands on its detail screen.
# Pass env MOBILE to type a specific mobile; default is 98 + stamp.
appId: com.shadowider.eCRM
---
- runFlow: open-work.yaml
- tapOn: "Leads, \\d+ yours"
- assertVisible: "Leads"
- tapOn: "New lead"
- assertVisible: "Name \\*"
- evalScript: ${output.stamp = String(Date.now()).slice(-8)}
- tapOn: "Who is it"
- inputText: "MAESTRO Lead ${output.stamp}"
- tapOn: "10-digit mobile number"
- inputText: "${typeof MOBILE !== 'undefined' ? MOBILE : '98' + output.stamp}"
- hideKeyboard
- tapOn:
    text: "Optional"
    below:
      text: "Company"
- inputText: "MAESTRO Co ${output.stamp}"
- hideKeyboard
- tapOn: "Amount in rupees"
- inputText: "120000"
- hideKeyboard
# Defaults: status New, owner = me, first follow-up Tomorrow.
- assertVisible: "Status: New"
- assertVisible: "Owner: Ayush Mishra \\(you\\)"
- assertVisible: "Call on .*"
# Save sits in the band (E 16).
- tapOn: "Save"
- assertVisible: "MAESTRO Lead ${output.stamp}"
- assertVisible: "Lead actions"
