# Log a call on a lead, then reassign it with reason + remarks. A reassign
# leaves the record (back to the list), so the call history is checked first.
appId: com.shadowider.eCRM
---
- runFlow: common/new-lead.yaml
- tapOn: "Lead actions"
- tapOn: "Log a call"
- assertVisible: "Direction"
- tapOn: "Outgoing"
- tapOn: "5"
- tapOn:
    id: "logcall-notes"
- inputText: "MAESTRO lead call ${output.stamp}"
- tapOn: "Save call"
- assertNotVisible: "Save call"
- waitForAnimationToEnd
- tapOn: "Activity"
- assertVisible: ".*MAESTRO lead call.*"   # typed text can drop letters on the emulator keyboard
- takeScreenshot: lead-call-history

- tapOn: "Reassign"
- assertVisible: "Reassign lead"
# Wait for the grouped list (it loads when the sheet opens) before typing.
- extendedWaitUntil:
    visible: "Your manager and team|Your office"
    timeout: 15000
- takeScreenshot: lead-reassign-picker
- tapOn:
    id: "reassign-search"
- inputText: "Priya Singh"
# The row, not the search box that now reads the same.
- tapOn:
    text: "Priya Singh"
    below:
      id: "reassign-search"
- waitForAnimationToEnd
- assertVisible: "Reassign to Priya"
- tapOn: "Overloaded"
- tapOn:
    id: "reassign-remarks"
- inputText: "MAESTRO lead reassign ${output.stamp}"
- tapOn: "Reassign to Priya"
- waitForAnimationToEnd
- assertVisible: "Reassigned to Priya Singh.*"
- takeScreenshot: lead-reassigned
