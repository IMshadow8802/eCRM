# Log a call on a lead, then reassign it with reason + remarks. A reassign
# leaves the record (back to the list), so the call history is checked first.
appId: com.shadowider.eCRM
---
- runFlow: common/new-lead.yaml
- tapOn: "Lead actions"
- tapOn: "Log a call"
- assertVisible: "Direction"
- tapOn: "Outgoing"
- tapOn: "5"
- tapOn:
    id: "logcall-notes"
- inputText: "MAESTRO lead call ${output.stamp}"
- tapOn: "Save call"
- assertNotVisible: "Save call"
- waitForAnimationToEnd
- tapOn: "Activity"
- assertVisible: ".*MAESTRO lead call.*"   # typed text can drop letters on the emulator keyboard
- takeScreenshot: lead-call-history

- tapOn: "Reassign"
- assertVisible: "Reassign lead"
- assertVisible: "Reassign to"
- takeScreenshot: lead-reassign-picker
- tapOn: "Amit Singh \\(Exec HO, under Neha\\)"
- assertVisible: "Reassign to Amit"
- tapOn: "Overloaded"
- tapOn:
    id: "reassign-remarks"
- inputText: "MAESTRO lead reassign ${output.stamp}"
- tapOn: "Reassign to Amit"
- waitForAnimationToEnd
- assertVisible: "Reassigned to Amit Singh.*"
- takeScreenshot: lead-reassigned
