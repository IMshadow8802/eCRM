# Qualified via the status sheet; Lost cannot be saved without a reason (the
# reason picker opens over the sheet); Won for 50000 shows the won banner.
appId: com.shadowider.eCRM
---
- runFlow: common/new-lead.yaml
- tapOn: "Status"
- assertVisible: "MAESTRO Lead ${output.stamp} · now New"
- tapOn: "Qualified"
- tapOn: "Save · mark qualified"
- waitForAnimationToEnd
- assertNotVisible: "Change status.*now.*"
- assertVisible: "Qualified"

- tapOn: "Status"
- assertVisible: ".* · now Qualified"
- tapOn: "Lost"
- assertVisible: "Why was it lost\\? \\*"
- assertVisible:
    text: "Save · mark lost"
    enabled: false
- takeScreenshot: status-lost-blocked
# The reason picker is a sheet over the status sheet (both stay); a reason
# enables Save. Close without saving — the lead stays Qualified.
- tapOn: "Why was it lost\\?: .*"
- waitForAnimationToEnd
- tapOn: "No Budget"
- assertVisible: "Why was it lost\\?: No Budget"
- assertVisible:
    text: "Save · mark lost"
    enabled: true
- tapOn:
    text: "Close"
    rightOf:
      text: "Change status"
- waitForAnimationToEnd
- assertVisible: "Qualified"

- tapOn: "Status"
- tapOn: "Won"
- tapOn: "Amount in rupees"
- inputText: "50000"
- hideKeyboard
- tapOn: "Save · mark won"
- waitForAnimationToEnd
# The won card leads the Details tab.
- tapOn: "Details"
- assertVisible: "Won for ₹50,000"
- takeScreenshot: status-won
