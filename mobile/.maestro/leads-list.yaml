# Leads (E 14): presets with counts (Mine · All · Overdue · New · Unassigned),
# the status pills, search. Adds its own lead, so it passes on a clean company.
appId: com.shadowider.eCRM
---
- runFlow: common/new-lead.yaml
- back
- assertVisible: "\\d+ yours"
- tapOn: "All, \\d+"
- assertVisible: "All, \\d+"
- tapOn: "Overdue, \\d+"
- assertVisible:
    id: "leads-list"
- tapOn: "New, \\d+"
- tapOn: "Unassigned, \\d+"
- tapOn: "Mine, \\d+"
- tapOn: "Search name, company, mobile"
- inputText: "zzzz-no-match"
- hideKeyboard
- assertVisible: "Nothing matches"
- tapOn: "Clear search"
- tapOn: "Search name, company, mobile"
- inputText: "${output.stamp}"
- hideKeyboard
- assertVisible: "MAESTRO Lead ${output.stamp}.*"
- assertVisible: "1 yours"
- takeScreenshot: leads-list
- tapOn: "Clear search"
