# Adds its own lead, so it passes on a clean company too.
appId: com.shadowider.eCRM
---
- runFlow: common/new-lead.yaml
- back
- assertVisible: "\\d+ yours"
- tapOn: "All"
- assertVisible: "\\d+ you can see"
- tapOn: "Overdue"
- assertVisible: "\\d+ overdue"
- swipe:
    from: "Overdue"
    direction: LEFT
- tapOn: "Unassigned"
- assertVisible: "\\d+ unassigned"
- swipe:
    from: "Unassigned"
    direction: RIGHT
- tapOn: "Mine"
- tapOn: "Name, company or mobile"
- inputText: "zzzz-no-match"
- assertVisible: "Nothing matches"
- eraseText: 20
- hideKeyboard
- tapOn: "Name, company or mobile"
- inputText: "${output.stamp}"
- hideKeyboard
- assertVisible: "MAESTRO Lead ${output.stamp}"
- assertVisible: "1 yours"
- takeScreenshot: leads-list
