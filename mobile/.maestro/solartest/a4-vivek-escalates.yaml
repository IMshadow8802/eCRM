# A4 Vivek opens it from Mine and escalates it to Vinod (his manager; Rohit is a peer since 150); it stays with him.
appId: com.shadowider.eCRM
---
- runFlow:
    file: ../access/find-complaint.yaml
    env:
      PRESET: "Mine"
      KEY: "${TAG}"
- tapOn: "Escalate"
- assertVisible: "Escalate complaint"
- extendedWaitUntil:
    visible: "Vinod Kumar\\s*"
    timeout: 15000
- tapOn: "Vinod Kumar\\s*"
- tapOn: "What they need to know — they get a notification"
- inputText: "${TAG} need senior"
- hideKeyboard
- tapOn: "Escalate to Vinod Kumar\\s*"
- extendedWaitUntil:
    notVisible: "Escalate complaint"
    timeout: 15000
- scrollUntilVisible:
    element: "Escalated to"
- takeScreenshot: a4-vivek-escalated
