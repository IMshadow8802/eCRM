# The queue across every visible lead: views, search, and a row opens its
# lead. Adds its own lead (which books a Tomorrow call), so it passes on a
# clean company too.
appId: com.shadowider.eCRM
---
- runFlow: common/new-lead.yaml
- runFlow: common/open-work.yaml
- tapOn: "Follow-ups due today"
- assertVisible: "\\d+ follow-ups"
- tapOn: "Overdue"
- assertVisible: "\\d+ follow-ups"
- tapOn: "Upcoming"
- tapOn: "Lead name, company or mobile"
- inputText: "${output.stamp}"
- hideKeyboard
- assertVisible: "MAESTRO Lead ${output.stamp}"
- assertVisible: "Call · Tomorrow"
- takeScreenshot: followups-upcoming
- tapOn: "MAESTRO Lead ${output.stamp}"
- assertVisible: "Lead actions"
- assertVisible: "Log follow-up"
- back
- assertVisible: "\\d+ follow-ups"
