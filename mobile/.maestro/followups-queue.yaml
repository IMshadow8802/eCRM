# The queue across every visible lead (E 17): views, search, and a row opens
# its lead. Adds its own lead (which books a Tomorrow call), so it passes on a
# clean company too.
appId: com.shadowider.eCRM
---
- runFlow: common/new-lead.yaml
- runFlow: common/open-work.yaml
- tapOn: "Follow-ups, \\d+ due today"
- assertVisible: "Follow-ups"
- tapOn: "Overdue.*"
- tapOn: "Upcoming.*"
- tapOn: "Search follow-ups"
- inputText: "${output.stamp}"
- hideKeyboard
- assertVisible: "MAESTRO Lead ${output.stamp}"
- takeScreenshot: followups-upcoming
- tapOn: "MAESTRO Lead ${output.stamp}"
- assertVisible: "Lead actions"
- back
- assertVisible: "Follow-ups"
- tapOn: "Close search"
