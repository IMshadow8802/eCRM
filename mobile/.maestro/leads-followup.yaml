# Log follow-up (action bar) finishes the booked call and books the next In 3
# days; Schedule a visit for Tomorrow from the menu; skip it from its row.
appId: com.shadowider.eCRM
---
- runFlow: common/new-lead.yaml
- tapOn: "Log follow-up"
- assertVisible: "Log the call"
- tapOn: "In 3 days"
- tapOn: "What was discussed — the next person reads this"
- inputText: "MAESTRO call done ${output.stamp}"
- hideKeyboard
- takeScreenshot: followup-log-sheet
- tapOn: "Mark done"
- waitForAnimationToEnd
- assertNotVisible: "Log the call"

- tapOn: "Lead actions"
- tapOn: "Schedule follow-up"
- assertVisible: "Schedule follow-up"
- tapOn: "Visit"
- tapOn: "Tomorrow"
- tapOn: "Add follow-up"
- waitForAnimationToEnd
- assertNotVisible: "Add follow-up"

- tapOn: "Follow-ups, \\d+"
- assertVisible: ".*MAESTRO call done ${output.stamp}.*"
- takeScreenshot: followup-logged
- tapOn: ".*Visit.*"
- tapOn: "Skip"
- assertVisible: "Skip this follow-up"
- tapOn: "Why it is not happening"
- inputText: "MAESTRO skip ${output.stamp}"
- hideKeyboard
- tapOn: "Skip follow-up"
- waitForAnimationToEnd
- assertVisible: ".*Skipped.*"
- takeScreenshot: followup-skipped
