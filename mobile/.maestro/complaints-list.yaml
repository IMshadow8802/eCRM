# The queue (E 10): five presets with counts (the row scrolls sideways:
# access/preset.yaml swipes to each), the status pills led by
# "Active n" (equal to the preset), search, and the empty state.
appId: com.shadowider.eCRM
---
- runFlow: common/open-work.yaml
- tapOn: "Open My complaints"
- assertVisible: "Complaints"
- assertVisible:
    id: "complaint-presets"
- assertVisible: "Mine, \\d+"
- runFlow:
    file: access/preset.yaml
    env:
      NAME: "Team, \\d+"
- assertVisible: "Active, \\d+"
- assertVisible:
    id: "complaints-list"
- runFlow:
    file: access/preset.yaml
    env:
      NAME: "Unassigned, \\d+"
- assertVisible: "Active, \\d+"
- runFlow:
    file: access/preset.yaml
    env:
      NAME: "Overdue, \\d+"
- assertVisible: "Active, \\d+"
- assertVisible: "Overdue \\d+ d"
- takeScreenshot: complaints-list
- runFlow:
    file: access/preset.yaml
    env:
      NAME: "Escalated, \\d+"
- assertVisible: "Active, \\d+"
# A status pill narrows within the preset.
- runFlow:
    file: access/preset.yaml
    env:
      NAME: "Team, \\d+"
- tapOn: "New, \\d+"
- waitForAnimationToEnd
- tapOn: "Active, \\d+"
- tapOn: "Search number, customer, mobile"
- inputText: "zzzz-no-match"
- assertVisible: "Nothing matches"
- tapOn: "Clear search"
- assertVisible:
    id: "complaints-list"
