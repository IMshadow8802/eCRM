appId: com.shadowider.eCRM
---
- runFlow: common/open-work.yaml
- tapOn: "Complaints"
- assertVisible: "Log and track|\\d+ assigned to you"
- tapOn: "Team"
- assertVisible: ".*in your team"
- tapOn: "Overdue"
- assertVisible: ".*overdue"
# Five presets: the strip scrolls sideways past the fourth.
- swipe:
    from: "Overdue"
    direction: LEFT
- tapOn: "Escalated"
- assertVisible: ".*escalated"
- swipe:
    from: "Escalated"
    direction: RIGHT
- tapOn: "Mine"
- tapOn: "Ticket no., subject, customer or mobile"
- inputText: "zzzz-no-match"
- assertVisible: "Nothing matches"
- eraseText: 20
- hideKeyboard
- takeScreenshot: complaints-list
- back
