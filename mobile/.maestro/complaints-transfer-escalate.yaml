# Escalate, then Reassign to an agent (reason + remarks). Reassign comes last:
# a reassign takes the record back to the list.
appId: com.shadowider.eCRM
---
- runFlow: common/new-complaint.yaml

# Escalate is on the action bar once the chain above is known.
- tapOn: "Escalate"
- assertVisible: "Escalate complaint"
- assertVisible: "TKT-\\d+ · it stays.*"
- tapOn: "Neha Gupta \\(TL Head Office\\)"
- tapOn:
    id: "escalate-remarks"
- inputText: "MAESTRO escalate ${output.stamp}"
- takeScreenshot: escalate-sheet
- tapOn:
    text: "Escalate.*"
    below:
      id: "escalate-remarks"
- waitForAnimationToEnd
- assertNotVisible: "Escalate complaint"
- assertVisible: "Escalated to Neha Gupta.*"
- assertVisible: "Escalated to Neha Gupta .* — MAESTRO escalate ${output.stamp}"
- takeScreenshot: escalate-history

- tapOn: "Reassign"
- assertVisible: "Reassign complaint"
# Picked from the list, not typed: adb input into a sheet that is still
# settling drops a character now and then ("Ait Singh", run 3).
- waitForAnimationToEnd
- tapOn: "Amit Singh \\(Exec HO, under Neha\\)"
# The pick folds the list to Amit, so the reason sits right below it.
- tapOn: "Overloaded"
- tapOn:
    id: "reassign-remarks"
- inputText: "MAESTRO reassign ${output.stamp}"
- takeScreenshot: reassign-sheet
- tapOn: "Reassign to Amit"
- waitForAnimationToEnd
- assertVisible: "Reassigned to Amit Singh.*"
- assertNotVisible: "Reassign complaint"
