# Reassign to an agent (search the grouped picker, reason + remarks), then
# Escalate to that agent's manager. Reassign first: the owner has nobody above
# them, so an unassigned complaint has no one to escalate to ("Nobody above
# you…"); once Imran Khan holds it, his chain (Vikram Rao) is offered. A
# reassign takes the record back to the list, so it is opened again from Team.
appId: com.shadowider.eCRM
---
- runFlow: common/new-complaint.yaml

- tapOn: "Reassign"
- assertVisible: "Reassign complaint"
# Wait for the list (it loads when the sheet opens) before typing.
- extendedWaitUntil:
    visible: "Your manager and team|Your office"
    timeout: 15000
- tapOn:
    id: "reassign-search"
- inputText: "Imran Khan"
# The row, not the search box that now reads the same.
- tapOn:
    text: "Imran Khan"
    below:
      id: "reassign-search"
- waitForAnimationToEnd
# The pick folds the list to him, so the reason sits right below.
- assertVisible: "Reassign to Imran"
- tapOn: "Overloaded"
- tapOn:
    id: "reassign-remarks"
- inputText: "MAESTRO reassign ${output.stamp}"
- takeScreenshot: reassign-sheet
- tapOn: "Reassign to Imran"
- waitForAnimationToEnd
- assertNotVisible: "Reassign complaint"

# Back on the list, search still set: it is now on the Team preset.
- runFlow:
    file: access/preset.yaml
    env:
      NAME: "Team, \\d+"
- tapOn: "TKT-.*MAESTRO complaint ${output.stamp}"
- assertVisible: "Reassigned to Imran Khan — Overloaded"

- tapOn: "Escalate"
- assertVisible: "Escalate complaint"
- assertVisible: "TKT-\\d+ · it stays with Imran Khan"
# The chain loads when the sheet opens.
- extendedWaitUntil:
    visible: "Vikram Rao"
    timeout: 15000
- tapOn: "Vikram Rao"
- tapOn:
    id: "escalate-remarks"
- inputText: "MAESTRO escalate ${output.stamp}"
- takeScreenshot: escalate-sheet
- tapOn:
    text: "Escalate.*"
    below:
      id: "escalate-remarks"
- waitForAnimationToEnd
- assertNotVisible: "Escalate complaint"
- assertVisible: "Escalated to Vikram Rao"
- assertVisible: "Escalated to Vikram Rao — MAESTRO.*"   # typed text can drop letters on the emulator keyboard
- takeScreenshot: escalate-history
