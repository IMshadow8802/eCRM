# Transfer to an agent (reason + remarks), then escalate to their manager.
appId: com.shadowider.eCRM
---
- runFlow: common/new-complaint.yaml
- tapOn: "Transfer"
- assertVisible: "Transfer complaint"
- tapOn:
    id: "transfer-search"
- inputText: "Amit Singh"
- hideKeyboard
- tapOn: "Amit Singh \\(Exec HO, under Neha\\)"
- tapOn: "Overloaded"
- tapOn:
    id: "transfer-remarks"
- inputText: "MAESTRO transfer ${output.stamp}"
- hideKeyboard
- takeScreenshot: transfer-sheet
- tapOn: "Transfer to Amit Singh \\(Exec HO, under Neha\\)"
- waitForAnimationToEnd
- assertNotVisible: "Transfer complaint"
- assertVisible: "Amit Singh \\(Exec HO, under Neha\\)"
- assertNotVisible: "Unassigned"

# Escalate is on the action bar once someone is working it.
- tapOn: "Escalate"
- assertVisible: "Escalate complaint"
- assertVisible: "TKT-\\d+ · it stays with Amit Singh.*"
- tapOn: "Neha Gupta \\(TL Head Office\\)"
- tapOn:
    id: "escalate-remarks"
- inputText: "MAESTRO escalate ${output.stamp}"
- hideKeyboard
- takeScreenshot: escalate-sheet
- tapOn:
    text: "Escalate.*"
    below:
      id: "escalate-remarks"
- waitForAnimationToEnd
- assertNotVisible: "Escalate complaint"
- assertVisible: "Escalated to Neha Gupta.*"
# The activity names both moves (the transfer line carries its reason).
- assertVisible: "Transferred to Amit Singh .* — Overloaded"
- assertVisible: "Escalated to Neha Gupta .* — MAESTRO escalate ${output.stamp}"
- takeScreenshot: transfer-escalate-history
