# Log a call, then On Hold -> In Progress -> Resolved (resolution + remarks);
# the activity shows every step.
appId: com.shadowider.eCRM
---
- runFlow: common/new-complaint.yaml
- tapOn: "Log call"
- assertVisible: "Direction"
- tapOn: "Outgoing"
- tapOn: "5"
- tapOn:
    id: "logcall-notes"
- inputText: "MAESTRO call ${output.stamp}"
- hideKeyboard
- tapOn: "Keep open"
- takeScreenshot: lifecycle-call
- tapOn: "Save call"
# The sheet closes once the call is saved.
- assertNotVisible: "Save call"
- waitForAnimationToEnd

# On hold from the action bar: a sheet with optional remarks.
- tapOn: "On hold"
- assertVisible: "TKT-\\d+ · MAESTRO complaint ${output.stamp}"
- tapOn:
    id: "compose-remarks"
- inputText: "MAESTRO hold ${output.stamp}"
- hideKeyboard
- tapOn:
    text: "Put on hold"
    below:
      id: "compose-remarks"
- assertNotVisible: "Optional note for the history"
- assertVisible: "On Hold"
# The closing sheet's backdrop eats a tap made mid-animation.
- waitForAnimationToEnd

- tapOn: "Complaint actions"
- tapOn: "Change status"
- tapOn: "Move to In Progress"
- assertVisible: "In Progress"
- waitForAnimationToEnd

- tapOn: "Resolve"
- assertVisible: "Resolve complaint"
- assertVisible: "Remarks \\*"
- tapOn: "Resolution: How was it fixed\\?"
# The picker stacks over the Resolve sheet; tap once it has settled.
- waitForAnimationToEnd
- tapOn: "Fixed"
- assertVisible: "Resolution: Fixed"
- tapOn:
    id: "resolve-remarks"
- inputText: "MAESTRO resolved ${output.stamp}"
- hideKeyboard
- takeScreenshot: lifecycle-resolve-sheet
- tapOn: "Save · mark resolved"
- waitForAnimationToEnd
- assertVisible: "Resolved"
# Activity: the call and every move are on it, newest first.
- assertVisible: ".*In Progress → Resolved — MAESTRO resolved ${output.stamp}"
- assertVisible: ".*On Hold → In Progress"
- assertVisible: ".*New → On Hold — MAESTRO hold ${output.stamp}"
- assertVisible: "MAESTRO call ${output.stamp}"
- takeScreenshot: lifecycle-history
# The resolution is on the Details card.
- scrollUntilVisible:
    element: "Fixed"
- assertVisible: "Resolution"
