# Today (E 04): hero (mine) → My team → tiles → Needs you; the five tabs; the
# Create sheet from "+ New" (04b); More (19) with sign-out moved there.
appId: com.shadowider.eCRM
---
- runFlow: common/open-work.yaml
- assertVisible: "My complaints"
- assertVisible: "Open My complaints"
# §7.9: the user's reach is wider than Own, so the team card shows.
- assertVisible:
    id: "team-card"
- assertVisible: "Tasks, \\d+ assigned to you"
- assertVisible: "Follow-ups, \\d+ due today"
- assertVisible: "Leads, \\d+ yours"
- assertVisible:
    id: "bottom-bar"
- assertVisible:
    id: "pill-Tasks"
- assertVisible:
    id: "pill-Complaints"
- assertVisible:
    id: "pill-Leads"
- assertVisible:
    id: "pill-More"
- takeScreenshot: smoke-home
- tapOn: "New new"
- assertVisible: "What do you want to start\\?"
- assertVisible: "New task"
- assertVisible: "New complaint"
- assertVisible: "New lead"
- takeScreenshot: smoke-create
- back
- waitForAnimationToEnd
- tapOn:
    id: "pill-More"
- assertVisible: "Inbox.*"
- assertVisible: "Workspaces.*"
- assertVisible: "Follow-ups.*"
- assertVisible: "Profile"
- assertVisible: "Sign out"
- takeScreenshot: smoke-more
