# Logs a complaint for a brand-new customer and checks what the detail shows.
appId: com.shadowider.eCRM
---
- runFlow: common/new-complaint.yaml
- assertVisible: "Technical"
- assertVisible: "medium"
- assertVisible: "Unassigned"
- assertVisible: ".*97${output.stamp}"
# The detail's action bar (E 11): Log call · On hold · Resolve (main) · Transfer.
- assertVisible:
    id: "action-bar"
- assertVisible: "Log call"
- assertVisible: "On hold"
- assertVisible: "Resolve"
- assertVisible: "Transfer"
- takeScreenshot: complaints-created-detail
