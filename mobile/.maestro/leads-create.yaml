# A pasted +91 mobile is stored as its ten digits; the detail shows it all.
appId: com.shadowider.eCRM
---
- runFlow:
    file: common/new-lead.yaml
    env:
      MOBILE: "+91 98250 12345"
- assertVisible: "98250 12345"
- assertVisible: ".*MAESTRO Co ${output.stamp}.*"
- assertVisible: ".*1,20,000.*"
- assertVisible: ".*Ayush Mishra.*"
# The action bar (E 15): Call · Message · Log follow-up (main) · Status · Transfer.
- assertVisible:
    id: "action-bar"
- assertVisible: "Log follow-up"
- assertVisible: "Status"
- takeScreenshot: lead-created-detail
